<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Challenge 1: Light / Dark Mode Toggle -->
        <header class="top-bar">
            <button id="theme-toggle" class="btn">🌓 Toggle Theme</button>
        </header>

        <!-- Greeting Section -->
        <section class="widget greeting-widget">
            <h1 id="time">00:00:00</h1>
            <p id="date">Day, Month Date, Year</p>
            <h2 class="greeting-wrapper">
                <span id="greeting-msg">Good morning,</span> 
                <!-- Challenge 2: Custom Name -->
                <span id="user-name" contenteditable="true" spellcheck="false">Amrul</span>
            </h2>
            <small>(Klik nama untuk mengubah)</small>
        </section>

        <div class="grid-layout">
            <!-- Focus Timer Section -->
            <section class="widget timer-widget">
                <h3>Focus Timer (25 Min)</h3>
                <div id="timer-display">25:00</div>
                <div class="btn-group">
                    <button id="timer-start" class="btn primary">Start</button>
                    <button id="timer-stop" class="btn">Stop</button>
                    <button id="timer-reset" class="btn danger">Reset</button>
                </div>
            </section>

            <!-- To-Do List Section -->
            <section class="widget todo-widget">
                <h3>To-Do List</h3>
                <div class="input-group">
                    <input type="text" id="todo-input" placeholder="Tambah tugas baru...">
                    <button id="todo-add" class="btn primary">Add</button>
                </div>
                <ul id="todo-list"></ul>
            </section>

            <!-- Quick Links Section -->
            <section class="widget links-widget">
                <h3>Quick Links</h3>
                <div class="input-group">
                    <input type="text" id="link-name" placeholder="Nama Web (ex: GitHub)">
                    <input type="url" id="link-url" placeholder="https://...">
                    <button id="link-add" class="btn primary">Add</button>
                </div>
                <div id="links-container" class="links-grid"></div>
            </section>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
